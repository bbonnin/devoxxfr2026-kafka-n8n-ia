services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"

  n8n:
    image: n8nio/n8n:2.9.0
    container_name: n8n
    depends_on:
      - kafka
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    volumes:
      - n8n-data:/home/node/.n8n

  mattermost-db:
    image: postgres:15-alpine
    container_name: mattermost-db
    environment:
      - POSTGRES_USER=mm
      - POSTGRES_PASSWORD=mm
      - POSTGRES_DB=mattermost
    volumes:
      - mattermost-db-data:/var/lib/postgresql/data

  mattermost:
    image: mattermost/mattermost-preview:11.4.0
    platform: linux/amd64 # Pour fonctionnement sur Mac / M3 (avec emulation)
    container_name: mattermost
    depends_on:
      - mattermost-db
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mm:mm@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
    volumes:
      - mattermost-data:/mattermost/data

  ticket-ui:
    build: ./ticket_ui
    container_name: ticket-ui
    ports:
      - "7001:7001"
    volumes:
      - tickets-data:/data

  runbook-api:
    build: ./runbook_api
    container_name: runbook-api
    ports:
      - "7003:7003"

  mcp-server:
    build: ./mcp_server
    container_name: mcp-server
    ports:
      - "7002:7002"
    environment:
      - TICKET_API_BASE=http://ticket-ui:7001
      - RUNBOOK_API_BASE=http://runbook-api:7003

volumes:
  kafka-data:
  n8n-data:
  mattermost-db-data:
  mattermost-data:
  tickets-data:
