{% macro card(t) -%}
  <div class="card" draggable="true" ondragstart="onDragStart(event,'{{t.id}}')" onclick="showTicket('{{t.id}}')">
    <div><strong>{{t.key}}</strong> — {{t.title}}</div>
    <div class="meta">
      <span class="pill">{{t.service}}</span>
      <span class="pill">{{t.env}}</span>
      <span class="pill sev-{{t.severity}}">{{t.severity}}</span>
      <span class="pill">{{t.status}}</span>
    </div>
  </div>
{%- endmacro %}
